[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moveq-core"
version = "0.1.0"
description = "Core types and algorithms for transport-equity analysis: Gini, Palma, Concentration Index, and weighted composite scoring."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
frames = ["pandas>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
