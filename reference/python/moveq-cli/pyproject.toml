[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moveq-cli"
version = "0.1.0"
description = "Command-line tool for moveq — compute equity metrics from a CSV without writing Python."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "moveq>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
moveq = "moveq_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
