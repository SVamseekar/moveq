name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            reference/python/moveq-core/pyproject.toml
            reference/python/moveq-catalogue/pyproject.toml
            reference/python/moveq/pyproject.toml
            reference/python/moveq-cli/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "reference/python/moveq-core[frames,test]"
          pip install -e "reference/python/moveq-catalogue[test]"
          pip install -e "reference/python/moveq[test]"
          pip install -e "reference/python/moveq-cli[test]"

      - name: Check lockstep versions
        run: python scripts/check_release_version.py

      - name: Run test suite
        run: pytest -v

      - name: Run example integration test
        run: python examples/basic_equity/run.py

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check static site
        run: python scripts/check_website.py

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run website tests
        run: pytest -v tests/test_website.py

  git-rules:
    name: Git release rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version must match latest tag unless this is a release
        run: python scripts/check_release_version.py --git-rules

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reference/python/moveq-core/pyproject.toml
            reference/python/moveq-catalogue/pyproject.toml
            reference/python/moveq/pyproject.toml
            reference/python/moveq-cli/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheels and sdists
        run: python scripts/build_dists.py

      - name: Check metadata
        run: python -m twine check --strict dist/*/*
