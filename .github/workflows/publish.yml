# Publish all four moveq packages.
#
# Production PyPI: push an annotated tag matching v* (for example v0.1.0).
# TestPyPI:        Actions → Publish → Run workflow.
#
# Trusted Publishing (OIDC) is used. Do not store a PyPI API token in this
# repository. Configure pending publishers before the first run; see
# docs/publishing.md.

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            reference/python/moveq-core/pyproject.toml
            reference/python/moveq-catalogue/pyproject.toml
            reference/python/moveq/pyproject.toml
            reference/python/moveq-cli/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "reference/python/moveq-core[frames,test]"
          pip install -e "reference/python/moveq-catalogue[test]"
          pip install -e "reference/python/moveq[test]"
          pip install -e "reference/python/moveq-cli[test]"

      - name: Run test suite
        run: pytest -v

      - name: Run example integration test
        run: python examples/basic_equity/run.py

  check-version:
    name: Check lockstep versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify package versions
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            python scripts/check_release_version.py "${GITHUB_REF_NAME}"
          else
            python scripts/check_release_version.py
          fi

  build:
    name: Build distributions
    needs: [test, check-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reference/python/moveq-core/pyproject.toml
            reference/python/moveq-catalogue/pyproject.toml
            reference/python/moveq/pyproject.toml
            reference/python/moveq-cli/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheels and sdists
        run: python scripts/build_dists.py

      - name: Check metadata
        run: python -m twine check --strict dist/*/*

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Pending Trusted Publishers are unique on (owner, repo, workflow, environment).
  # A monorepo therefore needs one GitHub environment per PyPI project name.
  publish-to-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - moveq
          - moveq-core
          - moveq-catalogue
          - moveq-cli
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          # Safe to re-run after the first three projects exist and the
          # fourth pending publisher is added (PyPI allows only 3 pending).
          skip-existing: true

  publish-to-testpypi:
    name: Publish ${{ matrix.package }} to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - moveq
          - moveq-core
          - moveq-catalogue
          - moveq-cli
    environment:
      name: testpypi-${{ matrix.package }}
      url: https://test.pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish ${{ matrix.package }} to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true

  github-release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*/*)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
