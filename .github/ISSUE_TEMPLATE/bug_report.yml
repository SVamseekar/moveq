name: Bug report
description: Something is not working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in every section you can.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal Python snippet, CLI command, or failing test.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `python -c "import moveq; print(moveq.__version__)"` or the version on PyPI.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install moveq?
      options:
        - PyPI (`pip install moveq`)
        - From source (editable / git clone)
        - Other
    validations:
      required: true
